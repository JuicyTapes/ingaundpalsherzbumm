<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inga und Pal und das Herz-Bumm – Hörbuch</title>
<meta name="theme-color" content="#162c5c">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg:#162c5c; --bg2:#0f2048; --card:#1f3a73; --gold:#f5d696; --cream:#ebe8de; --muted:#a9b6d6; --line:rgba(245,214,150,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #25498f 0%, var(--bg) 45%, var(--bg2) 100%) fixed;
    color:var(--cream); font-family:Georgia,"Times New Roman",serif; line-height:1.4;
    min-height:100vh; padding:0 16px 60px;
  }
  .wrap{max-width:520px; margin:0 auto}
  header{padding:28px 0 8px; text-align:center}
  .cover{width:min(78vw,340px); aspect-ratio:1; border-radius:20px; display:block; margin:0 auto 22px;
    box-shadow:0 18px 50px rgba(0,0,0,.45), 0 0 0 1px var(--line); object-fit:cover}
  .for{color:var(--gold); font-style:italic; font-size:1.05rem; margin:0 0 4px}
  h1{font-style:italic; font-weight:400; color:var(--gold); font-size:clamp(1.7rem,6.4vw,2.2rem); margin:0 0 6px; line-height:1.15}
  .sub{color:var(--muted); margin:0; font-style:italic}

  .player{background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:20px; padding:18px 18px 16px; margin:26px 0 18px; backdrop-filter:blur(6px)}
  .now{text-align:center; margin-bottom:12px}
  .now small{display:block; color:var(--muted); font-style:italic}
  .now strong{font-weight:400; font-style:italic; color:var(--gold); font-size:1.3rem}
  .bar{display:flex; align-items:center; gap:10px; font-size:.85rem; color:var(--muted); font-family:system-ui,sans-serif}
  .bar span{min-width:38px}
  .bar span:last-child{text-align:right}
  input[type=range]{flex:1; -webkit-appearance:none; appearance:none; height:6px; border-radius:6px; background:rgba(255,255,255,.18); outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--gold); border:0}
  input[type=range]::-moz-range-thumb{width:18px; height:18px; border-radius:50%; background:var(--gold); border:0}
  .ctl{display:flex; justify-content:center; align-items:center; gap:22px; margin-top:12px}
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
  .ic{width:48px; height:48px; border-radius:50%; display:grid; place-items:center; color:var(--cream)}
  .ic:hover{background:rgba(255,255,255,.08)}
  .ic svg{width:26px; height:26px; fill:currentColor}
  .play{width:70px; height:70px; border-radius:50%; background:var(--gold); color:#162c5c; display:grid; place-items:center; box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .play svg{width:30px; height:30px; fill:currentColor}
  .play:active{transform:scale(.96)}
  :focus-visible{outline:3px solid var(--gold); outline-offset:3px}

  h2{font-weight:400; font-style:italic; color:var(--gold); font-size:1.15rem; margin:26px 0 8px}
  ol{list-style:none; margin:0; padding:0}
  .ch{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:13px 14px; border-radius:14px; border:1px solid transparent}
  .ch:hover{background:rgba(255,255,255,.05)}
  .ch .n{width:30px; height:30px; flex:none; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; color:var(--muted); font-family:system-ui,sans-serif; font-size:.82rem}
  .ch .t{flex:1; font-size:1.05rem}
  .ch .d{color:var(--muted); font-family:system-ui,sans-serif; font-size:.82rem}
  .ch[aria-current=true]{background:rgba(245,214,150,.1); border-color:var(--line)}
  .ch[aria-current=true] .n{background:var(--gold); color:#162c5c; border-color:var(--gold)}
  .ch[aria-current=true] .t{color:var(--gold)}
  .tip{margin-top:28px; text-align:center; color:var(--muted); font-style:italic; font-size:.95rem}
  .tip b{color:var(--gold); font-weight:400}
  footer{margin-top:30px; text-align:center; color:var(--muted); font-size:.85rem}
  @media (prefers-reduced-motion:no-preference){ .ch{transition:background .2s} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="cover" src="cover.jpg" alt="Buchcover: Kätzchen Inga in der Mühle, Hund Pal im Boot, Vollmond über dem Meer">
    <p class="for">Für Inga</p>
    <h1>Inga und Pal<br>und das Herz-Bumm</h1>
    <p class="sub">Das Hörbuch zum Buch</p>
  </header>

  <section class="player" aria-label="Player">
    <div class="now"><small id="kap">Kapitel 1 von 15</small><strong id="titel">Die Mühle</strong></div>
    <div class="bar">
      <span id="cur">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position im Kapitel">
      <span id="dur">1:19</span>
    </div>
    <div class="ctl">
      <button class="ic" id="back" aria-label="15 Sekunden zurück"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
      <button class="ic" id="prev" aria-label="Voriges Kapitel"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12L18 18V6z"/></svg></button>
      <button class="play" id="play" aria-label="Abspielen"><svg viewBox="0 0 24 24" id="playicon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ic" id="next" aria-label="Nächstes Kapitel"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      <button class="ic" id="fwd" aria-label="15 Sekunden vor"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg></button>
    </div>
  </section>

  <h2>Kapitel</h2>
  <ol id="liste"></ol>

  <p class="tip"><b>Tipp:</b> Handy ans Bett, Licht aus, Ton an.<br>Die Kapitel laufen nacheinander von allein weiter.</p>
  <footer>Gute Nacht, Inga.</footer>
  <audio id="a" preload="metadata"></audio>
</div>

<script>
(function(){
  var K=[["Die Mühle",83],["Der Hafen",84],["Der Flüsterwald",52],["Der Fluss",46],["Der Sturm",62],["Der Strand",34],["Der Regen",47],["Die Linde",93],["Der Morgen",34],["Das Meer",35],["Zurück an der Mühle",26],["Der Herbst",61],["Der Nebel",134],["Die Sterne",70],["Gute Nacht",82]];
  var a=document.getElementById('a'), $=function(i){return document.getElementById(i)};
  var cur=0, seeking=false;
  function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}
  function src(i){return 'audio/'+('0'+(i+1)).slice(-2)+'.mp3'}
  function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

  var ol=$('liste');
  K.forEach(function(k,i){
    var li=document.createElement('li'), b=document.createElement('button');
    b.className='ch'; b.innerHTML='<span class="n">'+(i+1)+'</span><span class="t"></span><span class="d">'+fmt(k[1])+'</span>';
    b.querySelector('.t').textContent=k[0];
    b.onclick=function(){go(i,true)};
    li.appendChild(b); ol.appendChild(li);
  });
  function mark(){
    var bs=ol.querySelectorAll('.ch');
    for(var i=0;i<bs.length;i++){ if(i===cur) bs[i].setAttribute('aria-current','true'); else bs[i].removeAttribute('aria-current'); }
    $('kap').textContent='Kapitel '+(cur+1)+' von '+K.length;
    $('titel').textContent=K[cur][0];
    $('dur').textContent=fmt(K[cur][1]);
  }
  function setIcon(p){
    $('playicon').innerHTML=p?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
    $('play').setAttribute('aria-label',p?'Pause':'Abspielen');
  }
  function meta(){
    if(!('mediaSession' in navigator)) return;
    try{
      navigator.mediaSession.metadata=new MediaMetadata({title:K[cur][0],artist:'Inga und Pal und das Herz-Bumm',album:'Hörbuch',artwork:[{src:'cover.jpg',sizes:'900x900',type:'image/jpeg'}]});
      navigator.mediaSession.setActionHandler('previoustrack',function(){go(cur-1,true)});
      navigator.mediaSession.setActionHandler('nexttrack',function(){go(cur+1,true)});
      navigator.mediaSession.setActionHandler('seekbackward',function(){a.currentTime=Math.max(0,a.currentTime-15)});
      navigator.mediaSession.setActionHandler('seekforward',function(){a.currentTime=Math.min(a.duration||1e9,a.currentTime+15)});
    }catch(e){}
  }
  function go(i,play,t){
    if(i<0||i>=K.length) return;
    cur=i; a.src=src(i); mark(); meta(); store('hb_k',i);
    $('seek').value=0; $('cur').textContent='0:00';
    if(t){ a.addEventListener('loadedmetadata',function f(){a.removeEventListener('loadedmetadata',f);try{a.currentTime=t}catch(e){}}) }
    if(play){ var p=a.play(); if(p&&p.catch) p.catch(function(){}) }
  }
  $('play').onclick=function(){ if(!a.src||a.src===location.href) go(cur,true); else if(a.paused) a.play(); else a.pause(); };
  $('prev').onclick=function(){ if(a.currentTime>4) a.currentTime=0; else go(cur-1,!a.paused||true) };
  $('next').onclick=function(){ go(cur+1,true) };
  $('back').onclick=function(){ a.currentTime=Math.max(0,a.currentTime-15) };
  $('fwd').onclick=function(){ a.currentTime=Math.min(a.duration||1e9,a.currentTime+15) };
  a.addEventListener('play',function(){setIcon(true)});
  a.addEventListener('pause',function(){setIcon(false)});
  a.addEventListener('ended',function(){ if(cur<K.length-1) go(cur+1,true); else { setIcon(false); go(0,false); } });
  a.addEventListener('timeupdate',function(){
    if(!seeking && a.duration){ $('seek').value=Math.round(a.currentTime/a.duration*1000); }
    $('cur').textContent=fmt(a.currentTime);
    if(a.duration) $('dur').textContent=fmt(a.duration);
    if(Math.floor(a.currentTime)%5===0) store('hb_t',Math.floor(a.currentTime));
  });
  var sk=$('seek');
  sk.addEventListener('input',function(){seeking=true; if(a.duration) $('cur').textContent=fmt(sk.value/1000*a.duration)});
  sk.addEventListener('change',function(){ if(a.duration) a.currentTime=sk.value/1000*a.duration; seeking=false; });

  // Letzte Position merken (nur Vorbereitung, kein Autoplay)
  var k0=parseInt(load('hb_k'),10), t0=parseInt(load('hb_t'),10);
  if(k0>=0 && k0<K.length){ cur=k0; mark(); a.src=src(cur); if(t0>0) a.addEventListener('loadedmetadata',function f(){a.removeEventListener('loadedmetadata',f);try{a.currentTime=t0}catch(e){}}); }
  else { mark(); a.src=src(0); }
  meta();
})();
</script>
</body>
</html>
